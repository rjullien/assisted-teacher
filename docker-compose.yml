services:
  cours-ia:
    build: .
    container_name: cours-ia
    ports:
      - "9847:9847"
    environment:
      PORT: "9847"
      WORKSPACE_DIR: "/workspace"
      # Hermes Lya (OpenAI-compatible streaming API)
      HERMES_URL: "${HERMES_URL:-http://hermes-lya.openclaw.svc.cluster.local:8642}"
      # Must match hermes-lya API_SERVER_KEY (Infisical: /agents/hermes-lya)
      HERMES_API_KEY: "${HERMES_API_KEY:-}"
    volumes:
      - ./workspace:/workspace
      - ./config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9847/health"]
      interval: 30s
      timeout: 5s
      retries: 3
